name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: No leftover conflict markers
        working-directory: .
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>)' -- .; then
            echo "::error::Conflict markers found in the tree. Resolve before merge."
            exit 1
          fi
          echo "No conflict markers."
